<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="638" height="378" rx="14" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="320" y="28" fill="#1d3557" font-size="16" font-weight="700" text-anchor="middle">SPI: One Controller, Multiple Peripherals</text>

  <rect x="20" y="150" width="150" height="90" rx="8" fill="#eef2ff" stroke="#457b9d" stroke-width="2"/>
  <text x="95" y="200" fill="#1d3557" font-size="15" font-weight="600" text-anchor="middle">Controller</text>

  <rect x="480" y="25" width="140" height="70" rx="8" fill="#fde2e4" stroke="#e63946" stroke-width="2"/>
  <text x="550" y="65" fill="#9d0208" font-size="14" font-weight="600" text-anchor="middle">Peripheral 1</text>

  <rect x="480" y="160" width="140" height="70" rx="8" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="2"/>
  <text x="550" y="200" fill="#1b6f60" font-size="14" font-weight="600" text-anchor="middle">Peripheral 2</text>

  <rect x="480" y="295" width="140" height="70" rx="8" fill="#eef2ff" stroke="#457b9d" stroke-width="2"/>
  <text x="550" y="335" fill="#1d3557" font-size="14" font-weight="600" text-anchor="middle">Peripheral 3</text>

  <!-- shared SCLK/MOSI/MISO bundle -->
  <line x1="170" y1="195" x2="300" y2="195" stroke="#333" stroke-width="4"/>
  <text x="235" y="185" fill="#333" font-size="12" text-anchor="middle">SCLK, MOSI, MISO</text>
  <line x1="300" y1="60" x2="300" y2="330" stroke="#333" stroke-width="4"/>
  <line x1="300" y1="60" x2="480" y2="60" stroke="#333" stroke-width="4"/>
  <line x1="300" y1="195" x2="480" y2="195" stroke="#333" stroke-width="4"/>
  <line x1="300" y1="330" x2="480" y2="330" stroke="#333" stroke-width="4"/>

  <!-- individual CS lines -->
  <line x1="170" y1="230" x2="400" y2="230" stroke="#e63946" stroke-width="2"/>
  <line x1="400" y1="230" x2="400" y2="60" stroke="#e63946" stroke-width="2"/>
  <line x1="400" y1="60" x2="480" y2="60" stroke="#e63946" stroke-width="2" marker-end="url(#cs0)"/>
  <text x="220" y="222" fill="#9d0208" font-size="12">CS0</text>

  <line x1="170" y1="245" x2="420" y2="245" stroke="#2a9d8f" stroke-width="2"/>
  <line x1="420" y1="245" x2="420" y2="195" stroke="#2a9d8f" stroke-width="2"/>
  <line x1="420" y1="195" x2="480" y2="195" stroke="#2a9d8f" stroke-width="2" marker-end="url(#cs1)"/>
  <text x="220" y="260" fill="#1b6f60" font-size="12">CS1</text>

  <line x1="170" y1="260" x2="440" y2="260" stroke="#457b9d" stroke-width="2"/>
  <line x1="440" y1="260" x2="440" y2="330" stroke="#457b9d" stroke-width="2"/>
  <line x1="440" y1="330" x2="480" y2="330" stroke="#457b9d" stroke-width="2" marker-end="url(#cs2)"/>
  <text x="220" y="278" fill="#1d3557" font-size="12">CS2</text>

  <defs>
    <marker id="cs0" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e63946"/>
    </marker>
    <marker id="cs1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a9d8f"/>
    </marker>
    <marker id="cs2" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#457b9d"/>
    </marker>
  </defs>

  <text x="320" y="360" fill="#555" font-size="12" text-anchor="middle" font-style="italic">SCLK, MOSI, and MISO are shared by every peripheral; each one gets its own dedicated CS line</text>
</svg>
