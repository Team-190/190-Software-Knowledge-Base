<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="638" height="398" rx="14" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="320" y="28" fill="#1d3557" font-size="17" font-weight="700" text-anchor="middle">Trapezoidal Motion Profile</text>

  <!-- Velocity plot -->
  <text x="20" y="55" fill="#1d3557" font-size="13" font-weight="700">Velocity</text>
  <line x1="70" y1="60" x2="70" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="160" x2="580" y2="160" stroke="#333" stroke-width="2"/>

  <path d="M 70,160 L 190,80 L 400,80 L 520,160" fill="none" stroke="#457b9d" stroke-width="3.5"/>

  <line x1="190" y1="80" x2="190" y2="160" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="80" x2="400" y2="160" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="130" y="75" fill="#1d3557" font-size="12" text-anchor="middle">accelerate</text>
  <text x="295" y="70" fill="#1d3557" font-size="12" text-anchor="middle">cruise</text>
  <text x="460" y="75" fill="#1d3557" font-size="12" text-anchor="middle">decelerate</text>

  <!-- Acceleration plot -->
  <text x="20" y="215" fill="#1d3557" font-size="13" font-weight="700">Acceleration</text>
  <line x1="70" y1="220" x2="70" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="270" x2="580" y2="270" stroke="#333" stroke-width="2"/>

  <path d="M 70,270 L 70,235 L 190,235 L 190,270 L 400,270 L 400,305 L 520,305 L 520,270 L 580,270"
        fill="none" stroke="#e63946" stroke-width="3.5"/>

  <line x1="190" y1="220" x2="190" y2="320" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="220" x2="400" y2="320" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="325" y="355" fill="#333" font-size="14" text-anchor="middle">Time</text>

  <text x="320" y="385" fill="#555" font-size="12" text-anchor="middle" font-style="italic">acceleration jumps instantly between three fixed levels, a sudden jerk at each transition</text>
</svg>
