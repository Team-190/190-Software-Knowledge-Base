<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#457b9d"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="478" height="378" rx="14" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="240" y="28" fill="#1d3557" font-size="16" font-weight="700" text-anchor="middle">Pose2d: Translation2d + Rotation2d</text>

  <!-- field frame axes -->
  <line x1="70" y1="320" x2="70" y2="70" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="320" x2="420" y2="320" stroke="#333" stroke-width="2"/>
  <text x="425" y="324" fill="#333" font-size="13">+x (field)</text>
  <text x="70" y="60" fill="#333" font-size="13" text-anchor="middle">+y (field)</text>
  <circle cx="70" cy="320" r="3.5" fill="#333"/>
  <text x="55" y="340" fill="#555" font-size="12" text-anchor="middle">(0, 0)</text>

  <!-- translation to robot position -->
  <line x1="70" y1="320" x2="300" y2="160" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="150" y="270" fill="#1d3557" font-size="13">Translation (x, y)</text>

  <!-- robot as a rotated triangle, heading ~ -35 degrees from +x -->
  <g transform="translate(300,160) rotate(-35)">
    <polygon points="0,-26 18,16 -18,16" fill="#457b9d" stroke="#1d3557" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#e63946" stroke-width="2.5" marker-end="url(#arrowBlue3)"/>
  </g>

  <!-- heading angle arc, drawn in field frame at the robot's origin -->
  <path d="M 340 160 A 40 40 0 0 0 327 124" fill="none" stroke="#e63946" stroke-width="2" transform="translate(0,0)"/>
  <text x="332" y="145" fill="#e63946" font-size="13" font-weight="700">θ</text>

  <circle cx="300" cy="160" r="4" fill="#1d3557"/>
  <text x="220" y="120" fill="#1d3557" font-size="13" font-weight="700">Pose2d(x, y, θ)</text>

  <text x="240" y="358" fill="#555" font-size="12" text-anchor="middle" font-style="italic">
    only means something once you know which frame it's expressed in
  </text>
</svg>
